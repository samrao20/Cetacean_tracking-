<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" role="img" aria-label="Koamas logo — dolphin inside a fingerprint">
  <!-- Vector recreation of the Koamas fingerprint-dolphin mark,
       simplified so the ridges stay crisp at nav/favicon sizes.
       Transparent background; gradient matches the brand teal→green. -->
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb1c9"/>
      <stop offset="0.55" stop-color="#3fbfa4"/>
      <stop offset="1" stop-color="#61c96e"/>
    </linearGradient>
    <g id="dolphin">
      <path d="M86 44
               C82 40 79 38 75 38
               C70 39 66 42 63 45
               C61 39 58 36 55 35
               C54 41 55 46 56 49
               C50 57 45 70 43 82
               C42 88 42 93 42 97
               C36 99 30 101 26 105
               C31 106 36 107 40 108
               C44 109 50 108 54 106
               C50 102 48 100 46 97
               C48 84 52 66 60 55
               C64 52 68 49 72 47
               C77 46 82 45 86 44 Z"/>
      <path d="M64 52 C66 59 64 66 58 71 C58 64 60 56 64 52 Z"/>
    </g>
    <!-- Punch a dolphin-shaped gap (plus breathing room) out of the ridges
         so the mark works on any background, light or dark. -->
    <mask id="gap">
      <rect width="120" height="150" fill="#fff"/>
      <use href="#dolphin" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g mask="url(#gap)" fill="none" stroke="url(#lg)" stroke-width="3.1" stroke-linecap="round" transform="rotate(-9 60 75)">
    <ellipse cx="60" cy="75" rx="42"   ry="57" stroke-dasharray="70 7 40 8 90 9 60 7"/>
    <ellipse cx="60" cy="75" rx="36.5" ry="50" stroke-dasharray="55 8 75 7 38 9 80 6"/>
    <ellipse cx="60" cy="75" rx="31"   ry="43" stroke-dasharray="60 7 30 8 70 6 45 8"/>
    <ellipse cx="60" cy="75" rx="25.5" ry="36" stroke-dasharray="48 7 62 8 35 6"/>
    <ellipse cx="60" cy="75" rx="20"   ry="29" stroke-dasharray="40 6 55 7 30 7"/>
    <ellipse cx="60" cy="75" rx="14.5" ry="22" stroke-dasharray="45 6 35 7"/>
    <ellipse cx="62" cy="88" rx="9"    ry="13" stroke-dasharray="30 5 25 6"/>
    <ellipse cx="62" cy="88" rx="4.5"  ry="7"  stroke-dasharray="18 5 12 4"/>
  </g>

  <use href="#dolphin" fill="url(#lg)"/>
</svg>
